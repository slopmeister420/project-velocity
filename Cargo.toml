[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
bevy = "0.19"
byteorder = "1"
thiserror = "2"
log = "0.4"
glam = "0.30"
visos = { path = "crates/visos" }
visos_render = { path = "crates/visos_render" }
velocity_physics = { path = "crates/velocity_physics" }
velocity_ai = { path = "crates/velocity_ai" }
velocity_audio = { path = "crates/velocity_audio" }
velocity_frontend = { path = "crates/velocity_frontend" }
velocity_game = { path = "crates/velocity_game" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
