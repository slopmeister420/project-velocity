name: Linux build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libvulkan-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libxss-dev libxtst-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libpulse-dev \
            libdbus-1-dev libdecor-0-dev
      - name: Rust toolchain
        run: |
          rm -f rust-toolchain.toml
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p velocity
      - name: Package
        run: |
          mkdir out
          cp target/release/velocity out/
          tar -C out -czf velocity-linux-x86_64.tar.gz velocity
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-linux-x86_64
          path: velocity-linux-x86_64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" velocity-linux-x86_64.tar.gz --clobber
